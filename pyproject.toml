[project]
name = "browser-agents"
version = "0.1.0"
description = "JARVIS browser agents service — ghost, laya, browser-use"
requires-python = ">=3.12"
dependencies = [
    "browser-use",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "playwright>=1.63.0",
]

[tool.uv.sources]
browser-use = { path = "agents/ghost_browser", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
